<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudgate Tutorial</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f8fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 32px 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin-top: 10px;
      color: #d1d5db;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .card-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .card p {
      margin: 0;
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      padding: 32px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cloudgate Tutorial</h1>
    <p>클라우드게이트 설정 및 운영 가이드</p>
  </header>

  <main>
    <div class="section-title">가이드 목록</div>

    <div class="card-list">
      <a class="card" href="./ICD_setting.html">
        <h2>ICD 설정</h2>
        <p>ICD 생성, 상담사 연결, 분배 설정 관련 가이드입니다.</p>
      </a>

      <a class="card" href="#">
        <h2>상담사 계정 설정</h2>
        <p>상담사 계정 생성 및 권한 설정 가이드입니다.</p>
      </a>

      <a class="card" href="#">
        <h2>내선번호 설정</h2>
        <p>내선번호 등록 및 Web Phone 설정 가이드입니다.</p>
      </a>

      <a class="card" href="#">
        <h2>IVR 설정</h2>
        <p>IVR 시나리오 및 대표번호 연결 설정 가이드입니다.</p>
      </a>
    </div>
  </main>

  <footer>
    © Cloudgate Tutorial
  </footer>
</body>
</html>
